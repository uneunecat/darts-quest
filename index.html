<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DARTS QUEST</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Playfair+Display:ital,wght@1,600&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<div class="battle-container-wrapper">
    
    <div class="battle-side-info">
        <div class="battle-header-info">
            <div class="stg-info-row"><span id="stage-display">STAGE 1</span> <span id="floor-display">1F</span> <span class="boss-label" id="boss-label">BOSS</span></div>
            <div class="turn-info-row" id="turn-display">TURN 1</div>
        </div>

        <div class="side-block enemy-block-fixed">
            <div id="enemy-name-side" class="side-val-lg">Enemy Name</div>
            <div class="weak-display" id="weak-display">WEAK: 20+ CHANCE!</div>
            <div id="enemy-states-side" class="state-chips-container"></div>
        </div>

        <div class="side-block score-block-fixed">
            <div class="darts-stack">
                <div class="dart-row"><span>1st</span><span class="score-slot" id="slot-1-side">0</span></div>
                <div class="dart-row"><span>2nd</span><span class="score-slot" id="slot-2-side">0</span></div>
                <div class="dart-row"><span>3rd</span><span class="score-slot" id="slot-3-side">0</span></div>
            </div>
            <div class="darts-indicator">
                <span id="d-dot-1" class="d-dot">●</span><span id="d-dot-2" class="d-dot">●</span><span id="d-dot-3" class="d-dot">●</span>
            </div>
        </div>

        <div class="side-block player-block-fixed" id="player-panel">
            <div class="p-status-row">
                <span class="p-label-text">HP</span>
                <div class="hp-bar-bg small-bar"><div class="hp-bar-fill player-fill" id="player-hp-bar"></div></div>
                <span class="p-val"><span id="player-hp">100</span></span>
            </div>
            <div class="p-status-row">
                <span class="p-label-text">MP</span>
                <div id="player-mp-dots" class="mp-dots-container"></div>
                <span class="p-val" style="width:auto; margin-left:5px;"><span id="player-mp">3</span>/<span id="player-max-mp">10</span></span>
            </div>
            <div class="avg-row">Avg: <span id="avg-display">0.0</span> <span id="rt-display">(Rt -)</span></div>
            
            <div id="player-states-side" class="state-chips-container"></div>

            <div class="item-row">
                <button class="item-btn" id="btn-potion" onclick="useItem('potion')">💊x0</button>
                <button class="item-btn" id="btn-ether" onclick="useItem('ether')">⚗️x0</button>
                <button class="item-btn" id="btn-seed" onclick="useItem('seed')">🌱x0</button>
            </div>
        </div>
        
        <button class="home-btn-side" onclick="returnToTitle()">🏠 EXIT GAME</button>
    </div>

    <div class="battle-main-stage" id="enemy-panel">
        <div class="enemy-visual-area">
            <img id="enemy-img" src="" alt="Enemy">
            <img id="chest-img" src="assets/img_chest.png" alt="Chest" onclick="openChest()">
            
            <div class="enemy-hp-container">
                <div id="enemy-hp-value" class="hp-mega-text">100</div>
                <div class="hp-bar-bg big-bar"><div class="hp-bar-fill enemy-fill" id="enemy-hp-bar"></div></div>
            </div>
        </div>

        <div class="hand-overlay-container">
            <div class="deck-info">DECK: <span id="battle-deck-count">0</span> | HAND: <span id="hand-count-display">0</span></div>
            <div class="hand-wrapper">
                <div id="trap-slot" class="trap-slot empty">SET<br>TRAP</div>
                <div class="hand-area" id="hand-area"></div>
            </div>
        </div>
        
        <div style="display:none;"><div id="enemy-name"></div><div id="slot-1"></div><div id="slot-2"></div><div id="slot-3"></div></div>
    </div>
    
    <div id="battle-log"></div>
</div>
</html>
