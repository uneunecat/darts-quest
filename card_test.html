<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rarity Effect Prototype v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
            gap: 30px;
            font-family: 'Roboto Mono', monospace;
        }
        h1 { text-shadow: 0 0 10px #fff; margin-bottom: 10px; }
        
        .test-container {
            display: flex;
            gap: 40px;
            padding: 50px;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* --- CARD BASE --- */
        .collection-card {
            width: 140px;
            height: 210px; /* 少し縦長にしてテキストエリア確保 */
            margin: 0;
            position: relative;
            border-radius: 8px;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 枠内のみ表示 */
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .collection-card:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        /* --- LAYOUT & TEXT --- */
        .card-cost-badge {
            position: absolute; top: 0; left: 0;
            background: #00d2fc; color: #000;
            font-weight: bold; font-size: 12px;
            padding: 2px 8px;
            border-bottom-right-radius: 6px;
            z-index: 5;
        }
        .card-art {
            width: 100%;
            height: 55%; /* 画像エリア比率 */
            background: #000;
            position: relative;
            border-bottom: 1px solid #333;
        }
        .card-art img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-info {
            padding: 8px;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to bottom, #222, #1a1a1a);
        }

        /* 文字色とスタイルのベース */
        .card-name {
            font-size: 11px;
            font-weight: 900;
            margin-bottom: 4px;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-type {
            font-size: 8px;
            color: #888;
            margin-bottom: 4px;
        }
        .card-info-direct {
            font-size: 9px;
            color: #ccc;
            text-align: left; /* ★左揃え */
            line-height: 1.3;
            overflow: hidden;
            /* 全文表示のためclampなどは外すが、はみ出る場合は隠す */
        }

        /* --- 💎 RARITY STYLES 💎 --- */

        /* === NORMAL (N) === */
        /* マットで静か。枠は暗めのグレー */
        .rarity-N {
            border: 2px solid #444; 
        }
        .rarity-N .card-name {
            color: #fff; /* 白 */
        }

        /* === RARE (R) === */
        /* シルバーメタリック。枠に銀グラデ、文字も銀 */
        .rarity-R {
            border: 2px solid transparent; /* グラデ枠用 */
            background-image: linear-gradient(#1a1a1a, #1a1a1a), linear-gradient(135deg, #777, #fff, #777);
            background-origin: border-box;
            background-clip: content-box, border-box;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
        }
        .rarity-R .card-name {
            background: linear-gradient(to bottom, #fff 20%, #999 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 1px rgba(255,255,255,0.5);
        }
        /* R Effect: Sharp Silver Sheen */
        .rarity-R::after {
            content: ""; position: absolute; top:0; left:0; right:0; bottom:0;
            background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%);
            background-size: 300% 300%;
            animation: sheen-move 5s infinite;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* === SUPER RARE (SR) === */
        /* ゴールド・ラグジュアリー。ドット廃止 → 流体ゴールド */
        .rarity-SR {
            border: 2px solid transparent;
            background-image: linear-gradient(#1a1a1a, #1a1a1a), linear-gradient(135deg, #b8860b, #ffd700, #b8860b);
            background-origin: border-box;
            background-clip: content-box, border-box;
            box-shadow: 0 0 10px rgba(218, 165, 32, 0.4);
        }
        .rarity-SR .card-name {
            background: linear-gradient(to bottom, #ffd700 20%, #b8860b 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 2px rgba(218, 165, 32, 0.5);
        }
        /* SR Effect: Golden Flow */
        .rarity-SR::after {
            content: ""; position: absolute; top:0; left:0; right:0; bottom:0;
            background: linear-gradient(115deg, transparent 20%, rgba(255, 215, 0, 0.15) 40%, rgba(255, 255, 255, 0.5) 50%, rgba(255, 215, 0, 0.15) 60%, transparent 80%);
            background-size: 250% 250%;
            animation: sheen-move 3s infinite reverse; /* 逆方向に流してRと差別化 */
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* === ULTRA RARE (UR) === */
        /* プリズム・ゲーミング。回転枠 + 虹文字 */
        .rarity-UR {
            border: 2px solid transparent; /* スペース確保 */
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            overflow: hidden; /* 枠外の回転を隠す */
        }
        /* Rotating Rainbow Border Background */
        .rarity-UR::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(#ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff, #ff0000);
            animation: spin-UR 4s linear infinite;
            z-index: 0;
        }
        /* Inner Content Mask (to make the border visible) */
        .rarity-UR .inner-mask {
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            background: #1a1a1a;
            z-index: 1;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
        }
        /* Text Color: Moving Rainbow */
        .rarity-UR .card-name {
            background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-text 3s linear infinite;
            font-weight: 900;
        }
        /* UR Effect: Strong Prism */
        .rarity-UR::after {
            content: ""; position: absolute; top:0; left:0; right:0; bottom:0;
            background: linear-gradient(135deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 70%);
            background-size: 200% 200%;
            animation: sheen-move 2.5s infinite;
            z-index: 10;
            pointer-events: none;
            mix-blend-mode: color-dodge;
        }

        /* Animations */
        @keyframes sheen-move { 0% { background-position: 100% 100%; } 100% { background-position: 0% 0%; } }
        @keyframes spin-UR { 100% { transform: rotate(360deg); } }
        @keyframes rainbow-text { 0% { background-position: 0%; } 100% { background-position: 200%; } }

        .label { text-align: center; margin-top: 10px; color: #888; font-size: 10px; }
    </style>
</head>
<body>

    <h1>RARITY VISUAL v2</h1>

    <div class="test-container">
        
        <div>
            <div class="collection-card rarity-N">
                <div class="card-cost-badge">1</div>
                <div class="card-art"><img src="assets/cards/401.png"></div>
                <div class="card-info">
                    <div class="card-name">火の粉</div>
                    <div class="card-type">[MAGIC]</div>
                    <div class="card-info-direct">敵に20ダメージ</div>
                </div>
            </div>
            <div class="label">NORMAL (Basic)</div>
        </div>

        <div>
            <div class="collection-card rarity-R">
                <div class="card-cost-badge">5</div>
                <div class="card-art"><img src="assets/cards/301.png"></div>
                <div class="card-info">
                    <div class="card-name">光の護封剣</div>
                    <div class="card-type">[MAGIC]</div>
                    <div class="card-info-direct">3ターンの間、受けるダメージを半減させる。</div>
                </div>
            </div>
            <div class="label">RARE (Silver)</div>
        </div>

        <div>
            <div class="collection-card rarity-SR">
                <div class="card-cost-badge">6</div>
                <div class="card-art"><img src="assets/cards/201.png"></div>
                <div class="card-info">
                    <div class="card-name">サンダー・ボルト</div>
                    <div class="card-type">[MAGIC]</div>
                    <div class="card-info-direct">敵に100ダメージを与え、さらにスタン(1T行動不能)させる。</div>
                </div>
            </div>
            <div class="label">SUPER RARE (Gold)</div>
        </div>

        <div>
            <div class="collection-card rarity-UR">
                <div class="inner-mask">
                    <div class="card-cost-badge">1</div>
                    <div class="card-art"><img src="assets/cards/501.png"></div>
                    <div class="card-info">
                        <div class="card-name">天使の施し</div>
                        <div class="card-type">[MAGIC]</div>
                        <div class="card-info-direct">手札を1枚選んで捨て、カードを2枚引く。最強のドローソース。</div>
                    </div>
                </div>
            </div>
            <div class="label">ULTRA RARE (Rainbow)</div>
        </div>

    </div>

</body>
</html>
